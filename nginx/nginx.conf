# EZ Solutions AI Camera Analytics Platform — reverse proxy
# Routes:
#   /            -> frontend (static SPA)
#   /api/*       -> backend (FastAPI)
#   /ws/*        -> backend (WebSocket, real-time events/alerts)
# Section 58: HTTPS via a self-signed cert for lab use; swap in a real cert for
# production (see README "Ubuntu Server Installation" -> HTTPS section).
#
# backend/frontend are addressed via a resolver + proxy_pass variable, not a
# static `upstream {}` block or a bare hostname in proxy_pass — both of those
# are resolved ONCE when nginx starts/reloads and then cached for the life of
# the worker process. Any time `docker compose up -d --build backend` (or
# frontend) recreates that container, it gets a new internal IP, and nginx
# keeps sending traffic to the old dead one — every request 502s with
# "connect() failed (111: Connection refused)" until nginx itself is
# restarted. Using a variable forces nginx to re-resolve the hostname (via
# Docker's embedded DNS at 127.0.0.11) on every request instead, so a
# backend/frontend rebuild no longer requires a manual nginx restart.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2G;  # camera video uploads (section 46 upload limits are also enforced app-side)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
